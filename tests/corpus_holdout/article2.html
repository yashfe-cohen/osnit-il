<html><head><title>סכסוך בין האחים לוי על השליטה ברשת המזון</title></head><body><article>
<p>האחים דוד לוי ומשה לוי, בעלי השליטה ברשת "טעם טוב", מתדיינים בבית המשפט. לטענת דוד לוי, אחיו פעל בניגוד לטובת החברה.</p>
<p>עו"ד ענת כספי, המייצגת את משה לוי, מסרה כי "הטענות חסרות בסיס".</p>
<p>ממשרדי החברה נמסר: "אנו ממשיכים לפעול כרגיל". טלפון משרדי החברה: 08-9412233.</p>
</article></body></html>
