<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSNIT-IL · מרכז מודיעין</title>
<style>
:root{
 --bg:#0a0e14;--bg2:#0e131c;--panel:#121923;--panel2:#161f2b;--line:#1e2a3a;--line2:#27394f;
 --fg:#e6edf3;--mut:#8b9bb0;--dim:#5a6b80;
 --acc:#29d9c7;--acc2:#3b82f6;--ok:#2fcf7f;--warn:#f2b43a;--bad:#f2555a;--purple:#a371f7;
 --glow:0 0 0 1px var(--line),0 8px 30px -12px #000;
}
:root[data-theme="light"]{--bg:#eef1f6;--bg2:#e6eaf1;--panel:#fff;--panel2:#f5f7fb;--line:#dde3ec;--line2:#cfd8e6;
 --fg:#111823;--mut:#5a6b80;--dim:#8595a8;--acc:#0bb3a2;--glow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -16px rgba(16,24,40,.3);}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(1200px 600px at 85% -10%,rgba(41,217,199,.08),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(59,130,246,.07),transparent 55%),
 linear-gradient(transparent 0,transparent 31px,rgba(127,160,200,.035) 32px),linear-gradient(90deg,transparent 0,transparent 31px,rgba(127,160,200,.035) 32px);
 background-size:auto,auto,32px 32px,32px 32px;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:0 0,0 0,0 640px,640px 0}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.5px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 13px;border-radius:8px;color:var(--mut);font-weight:600;font-size:13px;cursor:pointer}
nav a:hover{background:var(--panel);color:var(--fg);text-decoration:none}
nav a.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
form.search{display:flex;gap:8px;flex:1;min-width:240px;margin-inline-start:auto}
input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
 border-radius:9px;padding:9px 12px;font-size:14px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
button,.btn{background:linear-gradient(180deg,var(--acc),#1fb8a8);color:#042023;border:0;border-radius:9px;padding:9px 15px;
 font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line2)}
.btn.sec:hover{border-color:var(--acc)}
main{position:relative;z-index:1;max-width:1280px;margin:18px auto;padding:0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--glow)}
.panel h2{margin:0 0 2px;font-size:15px;letter-spacing:.3px}.panel h3{margin:14px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 60%,color-mix(in srgb,var(--kc,var(--acc)) 10%,transparent));pointer-events:none}
.kpi .n{font-size:30px;font-weight:800;line-height:1.05;color:var(--kc,var(--fg))}
.kpi .l{color:var(--mut);font-size:12.5px;margin-top:3px}
.kpi .ico{position:absolute;inset-inline-end:12px;top:12px;opacity:.5}
.cols{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:2fr 1fr}
@media (max-width:900px){.cols,.cols3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);font-size:11.5px;color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.clk{cursor:pointer;color:var(--acc)}.ltr{direction:ltr;unicode-bidi:plaintext;display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.gone{text-decoration:line-through;opacity:.6}.new{background:color-mix(in srgb,var(--ok) 20%,transparent);border-radius:4px;padding:0 3px}
ul.items{margin:5px 0;padding-inline-start:16px}ul.items li{margin:3px 0}
.ev{font-size:12px;color:var(--mut);margin-inline-start:10px}
details summary{cursor:pointer;color:var(--mut)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:30px;text-align:center;color:var(--mut);transition:.15s;cursor:pointer}
.drop.hot{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);color:var(--fg)}
.feed{max-height:320px;overflow:auto}.feed li{font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted-when-empty:empty::after{content:"אין נתונים עדיין";color:var(--dim);font-size:12.5px}
.scan{position:relative;overflow:hidden}.scan::after{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.5;animation:scan 3s ease-in-out infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
@media (prefers-reduced-motion:reduce){.scan::after{display:none}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;margin:3px}
.prog{display:flex;align-items:center;gap:10px}
.live{font-size:12px;color:var(--dim)}.live.on{color:var(--ok)}
.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
 <div class="brand"><span class="dot"></span><span>OSNIT·IL</span></div>
 <nav id="nav">
  <a data-v="dashboard">לוח מחוונים</a><a data-v="db">מאגר</a><a data-v="contacts">אנשים</a><a data-v="uploads">קבצים</a><a data-v="subjects">חיפושים</a>
 </nav>
 <form class="search" id="f"><input id="q" type="text" placeholder="חיפוש עמוק — שם / מייל / טלפון / דומיין · למשל: יונתן חייט מספר טלפון" autocomplete="off"><button>חקירה</button></form>
 <button class="btn sec" id="pause" title="עצירת/המשך סריקת רשת">⏸ רשת</button>
 <button class="btn sec" id="theme" title="מצב תצוגה" style="padding:9px 11px">◐</button>
</header>
<main id="app"><div class="panel scan"><div class="sub">טוען…</div></div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const app=()=>$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>(n==null?"—":Number(n).toLocaleString("en-US"));
const pctC=c=>Math.round((c||0)*100);
const pct=c=>`<span class="pill ${c>=.7?'ok':c<.45?'warn':''}">${pctC(c)}%</span>`;
const day=t=>t?new Date(t*1000).toLocaleDateString("he-IL"):"—";
const tme=t=>t?new Date(t*1000).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}):"";
const link=(u,t)=>/^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:`<span class="ltr">${esc(t||u)}</span>`;
const TYPES={person:"אנשים",org:"ארגונים",email:"מיילים",phone:"טלפונים",domain:"דומיינים",url:"קישורים",role:"תפקידים"};
const TYPE1={person:"אדם",org:"ארגון",email:"מייל",phone:"טלפון",domain:"דומיין",url:"קישור",role:"תפקיד"};
const EVK={finding:"ממצא",gone:"נעלם",source_hit:"מקור",discovery:"גילוי",expansion:"הרחבה",started:"התחלה",finished:"סיום"};
const store={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let minConf=+store.g("osnit-minconf")||0, es=null, poll=null, lastProf=null, upTimer=null;

async function api(p,o){const r=await fetch(p,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
function setNav(v){$$("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v))}

/* ---------- charts ---------- */
function donut(tiers){
 const segs=[["name_email_phone_org","זהות מלאה","var(--ok)"],["name_and_contact","שם + איש קשר","var(--acc)"],
  ["name_and_affiliation","שם + שיוך","var(--acc2)"],["name_only","שם בלבד","var(--dim)"]];
 const total=segs.reduce((s,[k])=>s+(tiers[k]||0),0)||1;let a=-Math.PI/2;const R=52,r=34,cx=66,cy=66,arcs=[];
 segs.forEach(([k,,c])=>{const v=tiers[k]||0;if(!v)return;const ang=2*Math.PI*v/total,b=a+ang;
  const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(b),y2=cy+R*Math.sin(b);
  const xi=cx+r*Math.cos(b),yi=cy+r*Math.sin(b),xj=cx+r*Math.cos(a),yj=cy+r*Math.sin(a);
  arcs.push(`<path d="M${x1} ${y1}A${R} ${R} 0 ${ang>Math.PI?1:0} 1 ${x2} ${y2}L${xi} ${yi}A${r} ${r} 0 ${ang>Math.PI?1:0} 0 ${xj} ${yj}Z" fill="${c}"/>`);a=b});
 const comp=tiers.name_email_phone_org||0;
 return `<div class="row" style="gap:18px;align-items:center"><svg width="132" height="132" viewBox="0 0 132 132">${arcs.join("")}
  <text x="66" y="62" text-anchor="middle" style="fill:var(--fg);font-size:22px;font-weight:800">${comp}</text>
  <text x="66" y="80" text-anchor="middle" style="fill:var(--mut);font-size:10px">מלאות</text></svg>
  <div>${segs.map(([k,l,c])=>`<div class="row" style="gap:7px;margin:4px 0"><span style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></span><span class="sub" style="color:var(--fg)">${l}</span><span class="mono sub">${num(tiers[k]||0)}</span></div>`).join("")}</div></div>`}
function spark(series){
 const W=520,H=90,p=6,xs=series.map((_,i)=>p+i*(W-2*p)/(series.length-1||1));
 const mx=Math.max(1,...series.map(d=>d.count));const ys=series.map(d=>H-p-(H-2*p)*d.count/mx);
 const path=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join("");
 const area=`M${xs[0]} ${H-p}${path.slice(1)}L${xs[xs.length-1]} ${H-p}Z`;
 const dots=series.map((d,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${d.count?2:0}" fill="var(--acc)"><title>${d.date}: ${d.count}</title></circle>`).join("");
 return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#g)"/><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2"/>${dots}</svg>`}
function hbars(rows,val,lab){const max=Math.max(1,...rows.map(val));
 return `<table>${rows.map(r=>`<tr><td style="width:40%"><span class="clk" data-e="${r.id}">${esc(lab(r))}</span></td>
  <td><div class="bar"><i style="width:${Math.round(100*val(r)/max)}%"></i></div></td><td class="mono" style="width:46px;text-align:end">${num(val(r))}</td></tr>`).join("")||`<tr><td class="sub">אין נתונים</td></tr>`}</table>`}

/* ---------- dashboard ---------- */
async function viewDashboard(){setNav("dashboard");app().innerHTML=`<div class="panel scan"><div class="sub">טוען מודיעין…</div></div>`;
 let d;try{d=await api("/api/dashboard")}catch(e){app().innerHTML=`<div class="panel">שגיאה: ${esc(e.message)}</div>`;return}
 const c=d.counts,cm=d.completeness,q=d.data_quality;
 const kpi=(n,l,col,ic)=>`<div class="kpi" style="--kc:${col}"><div class="ico">${ic}</div><div class="n mono">${num(n)}</div><div class="l">${l}</div></div>`;
 app().innerHTML=`
 <div class="grid kpis">
  ${kpi(c.people,"אנשים","var(--acc)","👤")}
  ${kpi(cm.complete,"זהויות מלאות","var(--ok)","🎯")}
  ${kpi(c.emails,"מיילים ציבוריים","var(--acc2)","✉")}
  ${kpi(c.phones,"טלפונים ציבוריים","var(--purple)","☎")}
  ${kpi(c.orgs,"ארגונים","var(--warn)","🏢")}
  ${kpi(c.documents,"מסמכים","var(--acc)","📄")}
 </div>
 <div class="grid cols3">
  <div class="panel"><h2>פעילות — 30 ימים אחרונים</h2><div class="sub">ישויות חדשות שנאספו ליום</div>${spark(d.activity)}
   <div class="grid kpis" style="margin-top:12px">
    ${kpi(c.sources_scanned,"מקורות נסרקו","var(--acc)","")}
    ${kpi(c.relations,"קשרים","var(--acc2)","")}
    ${kpi(c.evidence,"ראיות","var(--ok)","")}
    ${kpi(c.subjects_active,"חקירות פעילות","var(--warn)","")}
   </div></div>
  <div class="panel"><h2>מלאות זהויות</h2><div class="sub">שם + ארגון/תפקיד + מייל או טלפון ציבורי</div>${donut(cm.tiers)}
   <div class="sub mono" style="margin-top:8px">${cm.complete_pct}% עם זהות מלאה · ${num(cm.with_email)} עם מייל · ${num(cm.with_phone)} עם טלפון</div></div>
 </div>
 <div class="grid cols">
  <div class="panel"><h2>ארגונים מובילים</h2><div class="sub">לפי מספר אנשים מקושרים</div>${hbars(d.top_orgs,r=>r.people,r=>r.display)}</div>
  <div class="panel"><h2>דומיינים מובילים</h2><div class="sub">לפי מספר מקורות</div>${hbars(d.top_domains,r=>r.sources,r=>r.display)}</div>
 </div>
 <div class="grid cols">
  <div class="panel"><h2>איכות המידע</h2>
   <table>
    <tr><td>ישויות בביטחון גבוה (≥70%)</td><td class="mono" style="text-align:end">${num(q.high_conf)}</td></tr>
    <tr><td>מאוששות (2+ מקורות עצמאיים)</td><td class="mono" style="text-align:end">${num(q.corroborated)}</td></tr>
    <tr><td>מקור יחיד (לאימות)</td><td class="mono" style="text-align:end">${num(q.single_source)}</td></tr>
   </table>
   <h3>סוגי מקורות</h3><div>${Object.entries(d.sources_by_kind).map(([k,v])=>`<span class="chip">${esc(k)} <b class="mono">${v}</b></span>`).join("")||'<span class="sub">—</span>'}</div></div>
  <div class="panel"><h2>ממצאים אחרונים</h2><ul class="items feed muted-when-empty">${d.recent_findings.map(f=>`<li><span class="pill acc">${TYPE1[f.type]||esc(f.type)}</span> <span class="ltr">${esc(f.value)}</span> ${f.confidence?pct(f.confidence):""} <span class="sub">· ${esc(f.subject)} · ${tme(f.at)}</span></li>`).join("")}</ul></div>
 </div>`;
 bindEnt(app())}

/* ---------- database browser ---------- */
async function viewDB(){setNav("db");app().innerHTML=`
 <div class="panel"><h2>חיפוש במאגר</h2><div class="row"><div style="flex:1;min-width:200px"><input id="eq" type="search" placeholder="שם, מייל, טלפון, דומיין…"></div>
  <select id="et" style="width:auto"><option value="">כל הסוגים</option>${Object.entries(TYPE1).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
  <div id="eres" style="margin-top:12px"></div></div>
 <div class="panel"><h2>אנשים וארגונים אחרונים</h2><div id="recent" class="sub">טוען…</div></div>`;
 const o=await api("/api/overview").catch(()=>({entities:[]}));
 $("#recent").innerHTML=entTable(o.entities);bindEnt($("#recent"));
 let t=null;const go=()=>{clearTimeout(t);t=setTimeout(searchEntities,220)};
 $("#eq").oninput=go;$("#et").onchange=go;$("#eq").focus()}
function entTable(list){return list.length?`<table><tr><th>ישות</th><th>סוג</th><th>מקורות</th><th>נראה לאחרונה</th></tr>
 ${list.map(e=>`<tr><td><span class="clk ltr" data-e="${e.id}">${esc(e.display)}</span></td><td><span class="pill">${TYPE1[e.type]||esc(e.type)}</span></td><td class="mono">${num(e.sources)}</td><td class="sub">${day(e.last_seen)}</td></tr>`).join("")}</table>`:'<div class="sub">אין תוצאות</div>'}
async function searchEntities(){const q=$("#eq").value.trim(),t=$("#et").value;if(!q&&!t){$("#eres").innerHTML="";return}
 const r=await api("/api/entities?q="+encodeURIComponent(q)+"&type="+t).catch(()=>[]);$("#eres").innerHTML=entTable(r);bindEnt($("#eres"))}
function bindEnt(root){root.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>{location.hash="entity/"+x.dataset.e})}
async function viewEntity(id){setNav("db");const d=await api("/api/entities/"+id).catch(()=>null);
 if(!d){app().innerHTML=`<div class="panel">הישות לא נמצאה</div>`;return}
 const e=d.entity,groups={};d.links.forEach(l=>(groups[l.type]=groups[l.type]||[]).push(l));
 app().innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between">
  <div><h2 style="font-size:19px"><span class="ltr">${esc(e.display)}</span> <span class="pill acc">${TYPE1[e.type]||esc(e.type)}</span></h2>
  <div class="sub">נראה לראשונה ${day(e.first_seen)} · לאחרונה ${day(e.last_seen)}</div></div>
  <div class="row">${["person","org","email","phone","domain"].includes(e.type)?`<button id="deep">חקירה עמוקה</button>`:""}<a class="btn sec" href="#db">חזרה</a></div></div>
  ${d.aliases.length?`<h3>כתיבים נוספים</h3>${d.aliases.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}`:""}</div>
  ${Object.entries(groups).map(([t,ls])=>`<div class="panel"><h2>${TYPES[t]||esc(t)} <span class="sub">(${ls.length})</span></h2><table>${ls.map(l=>`<tr><td><span class="clk ltr" data-e="${l.id}">${esc(l.display)}</span></td><td>${pct(l.confidence)}</td><td class="sub">${num(l.sources)} מקורות</td><td>${link(l.url,"מקור")}</td></tr>`).join("")}</table></div>`).join("")}
  <div class="panel"><h2>איפה נראה</h2><ul class="items">${d.seen.map(v=>`<li>“${esc(v.snippet)}” — ${link(v.url,v.title||v.url)} <span class="sub">${day(v.last_seen)}</span></li>`).join("")||'<span class="sub">—</span>'}</ul></div>`;
 bindEnt(app());if($("#deep"))$("#deep").onclick=async()=>{const x=await api("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:e.display})});location.hash="subject/"+x.subject_id}}

/* ---------- uploads ---------- */
async function viewUploads(){setNav("uploads");app().innerHTML=`
 <div class="panel"><h2>העלאת קבצים לעיבוד</h2>
  <div class="sub">גררו לכאן קובץ או רשימת קבצים — SQL · SQLite · CSV · TSV · JSON · JSONL · PDF · DOCX · XLSX · VCF · טקסט · HTML.
   המערכת מזהה את המבנה לבד, מחלצת מידע ומכניסה למאגר. הקובץ הגולמי נמחק אחרי העיבוד; רק המידע המחולץ נשמר.</div>
  <div class="drop" id="drop" style="margin-top:12px"><div style="font-size:30px">⬆</div><div><b>גררו קבצים לכאן</b> או לחצו לבחירה</div>
   <label class="row" style="justify-content:center;margin-top:8px"><input type="checkbox" id="keep"> <span class="sub">שמור את הקובץ המקורי (ברירת מחדל: נמחק אחרי עיבוד)</span></label>
   <input id="file" type="file" multiple hidden></div></div>
 <div class="panel"><h2>תור ועיבוד</h2><div id="imports" class="sub">טוען…</div></div>`;
 const drop=$("#drop"),file=$("#file");
 drop.onclick=e=>{if(e.target.tagName!=="INPUT"&&e.target.tagName!=="LABEL")file.click()};
 file.onchange=()=>{[...file.files].forEach(uploadFile);file.value=""};
 ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot")}));
 ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop")[...e.dataTransfer.files].forEach(uploadFile);drop.classList.remove("hot")}));
 refreshImports();clearInterval(upTimer);upTimer=setInterval(refreshImports,1500)}
async function uploadFile(f){const keep=$("#keep")&&$("#keep").checked;
 try{await fetch("/api/upload?delete_raw="+(keep?"0":"1"),{method:"POST",headers:{"X-Filename":encodeURIComponent(f.name).replace(/%/g,"_"),"Content-Type":"application/octet-stream"},body:f});}catch(e){}
 refreshImports()}
async function refreshImports(){if(!location.hash.startsWith("#uploads")){clearInterval(upTimer);return}
 const list=await api("/api/imports").catch(()=>[]);const el=$("#imports");if(!el)return;
 el.innerHTML=list.length?`<table><tr><th>קובץ</th><th>זוהה</th><th>מצב</th><th style="width:160px">התקדמות</th><th>רשומות</th></tr>
  ${list.map(j=>{const p=j.total?Math.min(100,Math.round(100*j.done/j.total)):(j.state==="done"?100:0);
   const st={queued:["בתור",""],running:["מעבד…","acc"],done:["הושלם","ok"],error:["שגיאה","bad"]}[j.state]||[j.state,""];
   return `<tr><td class="ltr">${esc(j.name)}</td><td><span class="pill">${esc(j.detected||"?")}</span></td>
    <td><span class="pill ${st[1]}">${st[0]}</span>${j.error?`<div class="sub bad" title="${esc(j.error)}">${esc(j.error.slice(0,40))}</div>`:""}</td>
    <td><div class="prog"><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><span class="mono sub">${p}%</span></div></td>
    <td class="mono">${num(j.records+j.documents)}${j.failed?` <span class="bad">(${j.failed}✗)</span>`:""}</td></tr>`}).join("")}</table>`
  :'<div class="sub">עדיין לא הועלו קבצים. אפשר גם להעתיק קבצים לתיקיית <span class="mono">data/inbox</span> והם ייקלטו אוטומטית.</div>'}

/* ---------- subjects list ---------- */
async function viewSubjects(){setNav("subjects");const list=await api("/api/subjects").catch(()=>[]);
 app().innerHTML=`<div class="panel"><h2>חקירות</h2>${list.length?`<table><tr><th>יעד</th><th>סוג</th><th>מצב</th><th>ממצאים</th><th>עודכן</th></tr>
 ${list.map(s=>`<tr><td><span class="clk" data-s="${s.id}">${esc(s.query)}</span></td><td><span class="pill">${TYPE1[s.kind]||esc(s.kind)}</span></td>
  <td><span class="pill ${s.status==="active"?"ok":""}">${s.status==="active"?"פעיל":"הסתיים"}</span></td><td class="mono">${num(s.findings)}</td><td class="sub">${s.last_event?tme(s.last_event):"—"}</td></tr>`).join("")}</table>`:'<div class="sub">אין חקירות עדיין. התחילו מהחיפוש למעלה.</div>'}</div>`;
 app().querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{location.hash="subject/"+x.dataset.s})}

/* ---------- subject profile ---------- */
function items(title,list){list=(list||[]).filter(i=>i.confidence>=minConf);if(!list.length)return"";
 const ST={gone:'<span class="pill bad">נעלם</span>',historical:'<span class="pill">היסטורי</span>'};
 return `<h3>${title}</h3><ul class="items">`+list.map(i=>`<li${i.status==="gone"?' class="gone"':''}><span class="ltr ${i.is_new?'new':''}">${esc(i.value)}</span>${i.is_new?' <span class="pill ok">חדש</span>':''}${ST[i.status]||""}${i.aliases&&i.aliases.length?` <span class="sub">(גם: ${i.aliases.map(esc).join(" | ")})</span>`:""} ${pct(i.confidence)}<span class="sub">${i.sources||1} מקורות · ${day(i.first_seen)}→${day(i.last_seen)}</span>
  <details><summary>הוכחות</summary>${i.evidence.map(e=>`<div class="ev${e.status==="gone"?' gone':''}">“${esc(e.snippet)}” — ${link(e.url)} ${pct(e.confidence)}</div>`).join("")}</details></li>`).join("")+"</ul>"}
function identCard(i,label){if(i.confidence<minConf&&!label)return"";
 const F={orgs:"ארגונים",roles:"תפקידים",emails:"מיילים ציבוריים",phones:"טלפונים ציבוריים",domains:"דומיינים",links:"קישורים",documents_linked:"מסמכים מקושרים"};
 return `<div class="panel"><h2>${esc(label||("זהות "+i.id+(i.label?": "+i.label:"")))} ${pct(i.confidence)}</h2>
  <div class="sub">${i.source_count} מקורות · ${day(i.first_seen)} → ${day(i.last_seen)}</div>
  ${i.names.length>1?`<h3>שמות חלופיים</h3>${i.names.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}`:""}
  ${Object.keys(F).map(k=>items(F[k],i[k])).join("")}
  ${i.documents.length?`<h3>מסמכים קשורים</h3><ul class="items">${i.documents.map(d=>`<li><span class="pill">${esc(d.kind)}</span> ${link(d.url,d.title||d.url)}</li>`).join("")}</ul>`:""}
  <details><summary>מקורות (${i.sources.length})</summary><ul class="items">${i.sources.map(s=>`<li>${link(s.url)} <span class="sub">${day(s.last_scanned)}</span></li>`).join("")}</ul></details></div>`}
function answerCard(p){const a=p.answer||{},parts=[];const L={phones:"טלפונים",emails:"מיילים",orgs:"מקומות עבודה"};
 for(const k of ["phones","emails","orgs"])if(a[k])parts.push(`<h3>${L[k]}</h3>`+(a[k].length?`<ul class="items">${a[k].map(i=>`<li><span class="ltr">${esc(i.value)}</span> ${pct(i.confidence)}<span class="sub">${i.sources} מקורות</span> ${link(i.evidence[0].url,"מקור")}</li>`).join("")}</ul>`:'<div class="sub">לא נמצא עדיין</div>'));
 if(a.documents)parts.push(`<h3>מסמכים ${esc((p.intent.filetypes||[]).join(", "))}</h3>`+(a.documents.length?`<ul class="items">${a.documents.map(d=>`<li><span class="pill">${esc(d.kind)}</span> ${link(d.url,d.title||d.url)}</li>`).join("")}</ul>`:'<div class="sub">לא נמצאו עדיין</div>'));
 return parts.length?`<div class="panel" style="border-color:var(--line2)"><h2>התשובה לבקשה · ${esc(p.intent.raw)}</h2>${parts.join("")}</div>`:""}
function graph(p){const ids=p.identities.filter(i=>i.confidence>=minConf).slice(0,6);if(!ids.length)return"";
 const W=900,H=440,cx=W/2,cy=H/2,N=[],E=[];N.push({x:cx,y:cy,r:17,c:"var(--acc)",t:p.subject.canonical,b:1});
 ids.forEach((i,k)=>{const a=2*Math.PI*k/ids.length-Math.PI/2,ix=cx+165*Math.cos(a),iy=cy+120*Math.sin(a);
  N.push({x:ix,y:iy,r:11,c:"var(--ok)",t:"זהות "+i.id});E.push([cx,cy,ix,iy,1]);
  const its=["orgs","roles","emails","phones","domains"].flatMap(f=>i[f]).filter(x=>x.confidence>=minConf).sort((a,b)=>b.confidence-a.confidence).slice(0,6);
  its.forEach((x,j)=>{const b=a+(j-(its.length-1)/2)*0.5,px=ix+150*Math.cos(b),py=iy+(j%2?108:72)*Math.sin(b);
   N.push({x:px,y:py,r:5,c:x.status==="gone"?"var(--bad)":"var(--dim)",t:x.value});E.push([ix,iy,px,py,0])})});
 const clip=s=>{s=String(s);return s.length>24?s.slice(0,23)+"…":s};
 return `<div class="panel"><h2>גרף קשרים</h2><svg width="100%" viewBox="0 0 ${W} ${H}">
  ${E.map(e=>`<line x1="${e[0]}" y1="${e[1]}" x2="${e[2]}" y2="${e[3]}" stroke="${e[4]?'var(--acc)':'var(--line2)'}" stroke-width="${e[4]?1.3:0.8}" opacity="${e[4]?0.6:0.4}"/>`).join("")}
  ${N.map(n=>`<g><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${n.c}"${n.b?' stroke="var(--acc)" stroke-width="2"':''}><title>${esc(n.t)}</title></circle><text x="${n.x}" y="${n.y+n.r+12}" text-anchor="middle" style="fill:var(--fg);font-size:10px">${esc(clip(n.t))}</text></g>`).join("")}
  </svg></div>`}
function renderSubject(p){lastProf=p;const s=p.subject,pr=p.progress;
 let h=`<div class="panel scan"><div class="row" style="justify-content:space-between">
  <div><h2 style="font-size:19px">${esc(s.canonical)} <span class="pill acc">${TYPE1[s.kind]||esc(s.kind)}</span> <span class="pill ${s.status==="active"?"ok":""}">${s.status==="active"?"● סריקה פעילה":"הסתיים"}</span></h2>
   <div class="sub">סבב ${s.rounds} · משימות גילוי: ${Object.entries(pr.jobs).map(([k,v])=>esc(k)+" "+v).join(", ")||"—"} · מקורות עם ממצא: ${pr.hits} · ${p.summary.identities} זהויות</div>
   ${p.since?`<div style="margin-top:4px"><span class="pill ok">מאז הצפייה הקודמת: ${p.since.new} חדשים</span> <span class="pill bad">${p.since.gone} נעלמו</span></div>`:""}</div>
   <div class="row"><span id="live" class="live"></span><a class="btn sec" href="/api/subjects/${s.id}/export?format=csv">CSV</a><a class="btn sec" href="/api/subjects/${s.id}/export?format=json">JSON</a>${s.status==="active"?`<button id="stop">עצור</button>`:""}</div></div>
   <div class="row" style="margin-top:8px"><label class="sub">ביטחון מינימלי</label><input id="mc" type="range" min="0" max="0.9" step="0.05" value="${minConf}" style="width:160px"><span class="mono sub" id="mcv">${pctC(minConf)}%</span>
   <details style="margin-inline-start:auto"><summary>וריאציות שם (${s.variants.length})</summary>${s.variants.map(v=>`<span class="chip ltr">${esc(v)}</span>`).join("")}</details></div></div>`;
 h+=answerCard(p);
 if(!p.identities.length&&!p.unattributed)h+=`<div class="panel sub">אין עדיין ממצאים — הסריקה ממשיכה ברקע והתוצאות יופיעו כאן.</div>`;
 h+=graph(p);
 p.identities.forEach(i=>h+=identCard(i));if(p.unattributed)h+=identCard(p.unattributed,"הופעות ללא הקשר מזהה");
 const rel=p.related.filter(r=>r.confidence>=minConf);
 if(rel.length)h+=`<div class="panel"><h2>קשרים לישויות אחרות</h2><ul class="items">${rel.map(r=>`<li>${esc(r.value)}${r.aliases&&r.aliases.length?` <span class="sub">(גם: ${r.aliases.map(esc).join(" | ")})</span>`:""} ${pct(r.confidence)}<div class="ev">${esc(r.evidence[0].snippet)}</div></li>`).join("")}</ul></div>`;
 if(p.similar_names.length)h+=`<div class="panel"><h2>שמות דומים <span class="sub">(לא אוחדו)</span></h2><ul class="items">${p.similar_names.map(r=>`<li>${esc(r.value)} <span class="sub">דמיון ${r.similarity}, ${r.sources} מקורות</span></li>`).join("")}</ul></div>`;
 h+=`<div class="panel"><h2>עדכונים בזמן אמת</h2><ul class="items feed">${p.events.map(e=>`<li><span class="sub mono">${tme(e.at)}</span> <span class="pill ${e.type==='gone'?'bad':e.type==='finding'?'acc':''}">${EVK[e.type]||esc(e.type)}</span> <span class="ltr">${esc(e.data.value||e.data.query||e.data.url||"")}</span> ${e.data.confidence?pct(e.data.confidence):""}</li>`).join("")}</ul></div>`;
 if(p.timeline.length)h+=`<div class="panel"><h2>היסטוריית מידע</h2><ul class="items">${p.timeline.slice(-20).reverse().map(t=>`<li class="sub">${day(t.at)} — ${t.what==="gone"?"נעלם":"הופיע"} ${TYPE1[t.type]||esc(t.type)}: <span class="ltr">${esc(t.value)}</span></li>`).join("")}</ul></div>`;
 app().innerHTML=h;
 $("#mc").oninput=e=>{minConf=+e.target.value;store.s("osnit-minconf",minConf);$("#mcv").textContent=pctC(minConf)+"%";renderSubject(lastProf)};
 if($("#stop"))$("#stop").onclick=async()=>{await fetch("/api/subjects/"+s.id+"/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});loadSubject(s.id)};
 setLive()}
function setLive(){const el=$("#live");if(!el)return;const on=es&&es.readyState===1;el.textContent=on?"● חי":poll?"○ רענון":"";el.classList.toggle("on",on)}
async function loadSubject(id){const since=+store.g("osnit-seen-"+id)||null;const p=await api("/api/subjects/"+id+(since?"?since="+since:"")).catch(()=>null);if(p)renderSubject(p)}
function liveSubject(id){if(es)es.close();clearInterval(poll);poll=null;
 if(!window.EventSource||/nolive/.test(location.search)){poll=setInterval(()=>loadSubject(id),4000);setLive();return}
 es=new EventSource("/api/subjects/"+id+"/stream?after="+(lastProf&&lastProf.events[0]?lastProf.events[0].id:0));
 es.addEventListener("update",()=>loadSubject(id));es.onopen=setLive;
 es.onerror=()=>{setLive();if(es.readyState===2){es=null;poll=setInterval(()=>loadSubject(id),4000);setLive()}}}
async function viewSubject(id){setNav("subjects");store.s("osnit-seen-"+id,String(Date.now()/1000));
 app().innerHTML=`<div class="panel scan"><div class="sub">טוען חקירה…</div></div>`;await loadSubject(id);liveSubject(id)}

/* ---------- routing ---------- */
function stopLive(){if(es){es.close();es=null}clearInterval(poll);poll=null;clearInterval(upTimer)}
async function viewContacts(){setNav("contacts");app().innerHTML=`
 <div class="panel"><div class="row" style="justify-content:space-between">
  <div><h2>טבלת אנשים</h2><div class="sub">שם · כל המיילים · כל הטלפונים · ארגונים — כל המאגר</div></div>
  <div class="row"><input id="cq" type="search" placeholder="סינון…" style="width:180px">
   <label class="sub row" style="gap:5px"><input type="checkbox" id="cc"> רק עם איש קשר</label>
   <a class="btn sec" id="cexp">ייצוא CSV</a></div></div>
  <div id="ctbl" class="sub" style="margin-top:10px">טוען…</div></div>`;
 async function load(){const q=encodeURIComponent($("#cq").value.trim()),cc=$("#cc").checked?"1":"";
  const d=await api("/api/contacts?q="+q+"&contactable="+cc).catch(()=>({rows:[],total:0}));
  $("#cexp").href="/api/contacts/export?q="+q+"&contactable="+cc;
  $("#ctbl").innerHTML=`<div class="sub" style="margin-bottom:6px">${d.rows.length} מתוך ${d.total} אנשים</div>
   <table><tr><th>שם</th><th>מיילים</th><th>טלפונים</th><th>ארגונים</th><th>מק'</th></tr>
   ${d.rows.map(r=>`<tr><td><span class="clk" data-e="${r.id}">${esc(r.name)}</span></td>
    <td class="ltr">${r.emails.map(esc).join("<br>")||'<span class="sub">—</span>'}</td>
    <td class="ltr mono">${r.phones.map(esc).join("<br>")||'<span class="sub">—</span>'}</td>
    <td>${r.orgs.map(esc).join(", ")||'<span class="sub">—</span>'}</td>
    <td class="mono">${r.sources}</td></tr>`).join("")||'<tr><td class="sub">אין אנשים עדיין — העלו קובץ או הריצו חיפוש</td></tr>'}</table>`;
  bindEnt($("#ctbl"))}
 let t=null;$("#cq").oninput=()=>{clearTimeout(t);t=setTimeout(load,220)};$("#cc").onchange=load;load()}
function route(){const h=location.hash.slice(1)||"dashboard";stopLive();
 if(h.startsWith("subject/"))return viewSubject(+h.split("/")[1]);
 if(h.startsWith("entity/"))return viewEntity(+h.split("/")[1]);
 if(h==="db")return viewDB();if(h==="contacts")return viewContacts();if(h==="uploads")return viewUploads();if(h==="subjects")return viewSubjects();
 return viewDashboard()}
$$("#nav a").forEach(a=>a.onclick=()=>{location.hash=a.dataset.v});
$("#f").onsubmit=async e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;
 try{const d=await api("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});$("#q").value="";location.hash="subject/"+d.subject_id}catch(err){alert(err.message)}};
async function refreshPause(){try{const st=await api("/api/stats");const b=$("#pause");
 b.textContent=st.paused?"▶ הפעל רשת":"⏸ עצור רשת";b.style.color=st.paused?"var(--warn)":"";}catch(e){}}
$("#pause").onclick=async()=>{const st=await api("/api/stats").catch(()=>({}));
 await fetch(st.paused?"/api/resume":"/api/pause",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).catch(()=>{});refreshPause()};
refreshPause();setInterval(refreshPause,5000);
(function theme(){const t=store.g("osnit-theme");if(t)document.documentElement.dataset.theme=t;
 $("#theme").onclick=()=>{const n=document.documentElement.dataset.theme==="light"?"dark":"light";
  document.documentElement.dataset.theme=n;store.s("osnit-theme",n)}})();
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
