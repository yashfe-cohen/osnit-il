<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSNIT-IL</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--mut:#5b6573;--card:#fff;--line:#dfe3e8;--acc:#1f5fbf;--ok:#1a7f4b;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--fg:#e6e9ee;--mut:#9aa5b4;--card:#171d26;--line:#2a3340;--acc:#6aa3ff;--ok:#4cc38a;--warn:#e0a458}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
form{display:flex;gap:8px;max-width:900px;margin:auto}input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;cursor:pointer}
main{max-width:900px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
h2{margin:0 0 4px;font-size:20px}h3{margin:12px 0 4px;font-size:15px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;margin-inline-end:4px}
.hi{color:var(--ok)}.lo{color:var(--warn)}ul{margin:4px 0;padding-inline-start:20px}li{margin:2px 0}
details summary{cursor:pointer}a{color:var(--acc);word-break:break-all}.ev{font-size:12px;color:var(--mut);margin-inline-start:12px}
#feed li{font-size:13px}.ltr{direction:ltr;unicode-bidi:plaintext}.gone{text-decoration:line-through;opacity:.65}.new{background:color-mix(in srgb,var(--ok) 18%,transparent);border-radius:4px;padding:0 3px}
</style>
</head>
<body>
<header><form id="f"><input id="q" placeholder="שם אדם / ארגון / מייל / טלפון / דומיין — למשל: יונתן חייט" autofocus><button>חיפוש</button></form></header>
<main><div id="out" class="mut">הזן חיפוש. התוצאה הראשונית מוצגת מיד מהמאגר, והסריקה העמוקה ממשיכה ברקע ומתעדכנת כאן.</div></main>
<script>
const $=s=>document.querySelector(s);let sid=null,timer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=c=>`<span class="pill ${c>=.7?'hi':c<.45?'lo':''}">${Math.round(c*100)}%</span>`;
const day=t=>t?new Date(t*1000).toLocaleDateString("he-IL"):"?";
const ST={gone:'<span class="pill lo">נעלם מהמקור</span>',historical:'<span class="pill">היסטורי</span>'};
let since=null;const seenKey=id=>"osnit-seen-"+id;
function lastSeen(id){try{return +localStorage.getItem(seenKey(id))||null}catch(e){return null}}
function markSeen(id){try{localStorage.setItem(seenKey(id),String(Date.now()/1000))}catch(e){}}
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";
function items(title,list){if(!list||!list.length)return"";
 return `<h3>${title}</h3><ul>`+list.map(i=>`<li${i.status==="gone"?' class="gone"':''}><span class="ltr ${i.is_new?'new':''}">${esc(i.value)}</span>${i.is_new?' <span class="pill hi">חדש</span>':''}${ST[i.status]||""}${i.aliases&&i.aliases.length?` <span class="mut">(גם: ${i.aliases.map(esc).join(" | ")})</span>`:""} ${pct(i.confidence)}<span class="mut">${i.sources||1} מקורות · ${day(i.first_seen)}→${day(i.last_seen)}</span>
 <details><summary class="mut">הוכחות</summary>${i.evidence.map(e=>`<div class="ev${e.status==="gone"?' gone':''}">“${esc(e.snippet)}” — <a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">${esc(e.url)}</a> ${pct(e.confidence)}</div>`).join("")}</details></li>`).join("")+"</ul>"}
function ident(i,label){return `<div class="card"><h2>${esc(label||("זהות/מופע "+i.id+(i.label?": "+i.label:"")))} ${pct(i.confidence)}</h2>
 <div class="mut">${i.source_count} מקורות · נראה לראשונה ${day(i.first_seen)} · לאחרונה ${day(i.last_seen)}</div>
 ${i.names.length>1?`<h3>שמות חלופיים</h3><div>${i.names.map(n=>`<span class="pill">${esc(n)}</span>`).join("")}</div>`:""}
 ${items("ארגונים",i.orgs)}${items("תפקידים",i.roles)}${items("מיילים ציבוריים",i.emails)}${items("טלפונים ציבוריים",i.phones)}${items("דומיינים",i.domains)}${items("קישורים",[...i.links,...i.documents_linked])}
 ${i.documents.length?`<h3>מסמכים קשורים</h3><ul>${i.documents.map(d=>`<li><span class="pill">${esc(d.kind)}</span><a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener noreferrer">${esc(d.title||d.url)}</a></li>`).join("")}</ul>`:""}
 <details><summary class="mut">מקורות (${i.sources.length})</summary><ul>${i.sources.map(s=>`<li><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a> <span class="mut">נסרק ${day(s.last_scanned)}</span></li>`).join("")}</ul></details></div>`}
function answerCard(p){const a=p.answer||{};const parts=[];
 const lab={phones:"טלפונים",emails:"מיילים",orgs:"מקומות עבודה"};
 for(const k of ["phones","emails","orgs"]) if(a[k]) parts.push(`<h3>${lab[k]}</h3>`+(a[k].length?`<ul>${a[k].map(i=>`<li><span class="ltr">${esc(i.value)}</span> ${pct(i.confidence)}<span class="mut">${i.sources} מקורות</span> <a href="${esc(safeUrl(i.evidence[0].url))}" target="_blank" rel="noopener noreferrer">מקור</a></li>`).join("")}</ul>`:`<div class="mut">לא נמצא (עדיין)</div>`));
 if(a.documents) parts.push(`<h3>מסמכים (${esc((p.intent.filetypes||[]).join(", ")||"הכול")})</h3>`+(a.documents.length?`<ul>${a.documents.map(d=>`<li><span class="pill">${esc(d.kind)}</span><a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener noreferrer">${esc(d.title||d.url)}</a></li>`).join("")}</ul>`:`<div class="mut">לא נמצאו (עדיין)</div>`));
 return parts.length?`<div class="card"><h2>התשובה לבקשה: ${esc(p.intent.raw)}</h2>${parts.join("")}</div>`:""}
function render(p){const s=p.subject,pr=p.progress;
 let h=`<div class="card"><h2>${esc(s.canonical)} <span class="pill">${esc(s.kind)}</span><span class="pill">${s.status==="active"?"סריקה ברקע פעילה":"הסתיים"}</span></h2>
 ${p.since?`<div><span class="pill hi">מאז הצפייה הקודמת: ${p.since.new} חדשים</span><span class="pill lo">${p.since.gone} נעלמו</span></div>`:""}<div class="mut">סבב ${s.rounds} · משימות גילוי: ${esc(JSON.stringify(pr.jobs))} · מקורות עם ממצא: ${pr.hits} · ${p.summary.identities} זהויות אפשריות</div>
 <details><summary class="mut">וריאציות שם (${s.variants.length})</summary>${s.variants.map(v=>`<span class="pill ltr">${esc(v)}</span>`).join("")}</details>
 ${s.status==="active"?`<button onclick="stop()" style="margin-top:8px">עצור סריקה</button>`:""}</div>`+answerCard(p);
 if(!p.identities.length&&!p.unattributed)h+=`<div class="card mut">אין עדיין ממצאים במאגר — הסריקה ממשיכה ברקע והתוצאות יופיעו כאן.</div>`;
 p.identities.forEach(i=>h+=ident(i));if(p.unattributed)h+=ident(p.unattributed,"הופעות ללא הקשר מזהה (לא משויך)");
 if(p.related.length)h+=`<div class="card"><h2>קשרים לישויות אחרות</h2><ul>${p.related.map(r=>`<li>${esc(r.value)} ${pct(r.confidence)}<div class="ev">${esc(r.evidence[0].snippet)}</div></li>`).join("")}</ul></div>`;
 if(p.similar_names.length)h+=`<div class="card"><h2>שמות דומים (לא אוחדו)</h2><ul>${p.similar_names.map(r=>`<li>${esc(r.value)} <span class="mut">דמיון ${r.similarity}, ${r.sources} מקורות</span></li>`).join("")}</ul></div>`;
 h+=`<div class="card"><h2>עדכונים בזמן אמת</h2><ul id="feed">${p.events.map(e=>`<li><span class="mut">${new Date(e.at*1000).toLocaleTimeString("he-IL")}</span> ${esc(e.type)}: <span class="ltr">${esc(e.data.value||e.data.query||e.data.url||"")}</span> ${e.data.confidence?pct(e.data.confidence):""}</li>`).join("")}</ul></div>`;
 if(p.timeline.length)h+=`<div class="card"><h2>היסטוריית מידע</h2><ul>${p.timeline.slice(-15).reverse().map(t=>`<li class="mut">${day(t.at)} — ${t.what==="gone"?"נעלם":"הופיע"} ${esc(t.type)}: <span class="ltr">${esc(t.value)}</span></li>`).join("")}</ul></div>`;
 $("#out").className="";$("#out").innerHTML=h;if(s.status!=="active"&&timer){clearInterval(timer);timer=null}}
async function load(){if(!sid)return;const r=await fetch("/api/subjects/"+sid+(since?"?since="+since:""));if(r.ok)render(await r.json())}
function openSubject(id){sid=id;since=lastSeen(id);markSeen(id);load();clearInterval(timer);timer=setInterval(load,4000)}
async function stop(){await fetch("/api/subjects/"+sid+"/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});load()}
$("#f").onsubmit=async e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;
 const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});
 const d=await r.json();if(!r.ok){$("#out").textContent=d.error;return}location.hash=d.subject_id;openSubject(d.subject_id)};
if(/^#\d+$/.test(location.hash))openSubject(+location.hash.slice(1));
</script>
</body>
</html>
