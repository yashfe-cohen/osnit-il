/* =========================================================================
   Information Types & Rules (viewTypes)
   ========================================================================= */
async function viewTypes() {
  const g = NAV;
  setNav("types");
  const T = await typeInfo(true);
  const F = await api("/api/fields").catch(() => ({memory: [], kept: []}));
  if (g !== NAV) return;

  app().innerHTML = `
    <div class="panel notched">
      <h2>🏷️ הגדרת סוגי מידע מותאמים אישית (Custom Entity Types)</h2>
      <div class="sub">הגדר שדות ייחודיים (מספר עובד, תעודת לוחם, קוד פנימי) שהמערכת תזהה ותצליב אוטומטית.</div>
      <div class="form" style="margin-top:14px">
        <label>שם הסוג:</label><input type="text" id="ctL" placeholder="למשל: מספר עובד">
        <label>שמות עמודות:</label><input type="text" id="ctH" placeholder="emp_id, worker_no, מספר עובד">
        <label>דוגמאות לערכים:</label><textarea id="ctE" placeholder="EMP-10023&#10;EMP-88123" rows="2"></textarea>
        <label>תבנית Regex:</label><input type="text" id="ctP" class="ltr" placeholder="EMP-\\d{5}">
        <label>מאפיינים:</label>
        <div class="row" style="gap:16px;padding-top:6px">
          <label class="row" style="gap:6px"><input type="checkbox" id="ctI" checked> מזהה מצליב (מקשר רשומות)</label>
          <label class="row" style="gap:6px"><input type="checkbox" id="ctS"> מידע רגיש</label>
        </div>
        <span></span>
        <div class="row">
          <button id="ctSave">💾 שמור סוג מידע</button>
          <span id="ctOut" class="sub"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>סוגי מידע מותאמים פעילים (${T.custom.length})</h2>
      ${T.custom.length ? `
        <div class="tblwrap">
          <table>
            <tr><th>שם</th><th>עמודות</th><th>תבנית</th><th>מאפיין</th><th>פעולות</th></tr>
            ${T.custom.map(c => `
              <tr>
                <td><b>${esc(c.label)}</b> <span class="mono sub">${esc(c.key)}</span></td>
                <td class="ltr">${esc(c.headers.join(", ")) || "—"}</td>
                <td class="mono ltr">${esc(c.pattern) || "—"}</td>
                <td>${c.identifier ? '<span class="pill ok">מזהה</span>' : '<span class="pill">שדה</span>'}</td>
                <td><button class="btn danger sm" data-del="${esc(c.key)}">🗑 מחק</button></td>
              </tr>
            `).join("")}
          </table>
        </div>
      ` : '<div class="sub">לא הוגדרו עדיין סוגי מידע מותאמים.</div>'}
    </div>
  `;

  $("#ctSave").onclick = async () => {
    const b = {
      label: $("#ctL").value,
      headers: $("#ctH").value.split(",").map(x => x.trim()).filter(Boolean),
      examples: $("#ctE").value.split("\n").map(x => x.trim()).filter(Boolean),
      pattern: $("#ctP").value.trim(),
      identifier: $("#ctI").checked,
      sensitive: $("#ctS").checked
    };
    try {
      const r = await api("/api/types", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(b)
      });
      toast("סוג המידע נשמר בהצלחה", "ok");
      TINFO = null;
      setTimeout(viewTypes, 800);
    } catch (e) {
      toast(e.message, "err");
    }
  };

  app().querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("למחוק סוג מידע זה?")) return;
    await api(`/api/types/${b.dataset.del}/delete`, { method: "POST" });
    toast("סוג המידע נמחק", "ok");
    TINFO = null;
    viewTypes();
  });
}

/* =========================================================================
   Router & Top Search Execution
   ========================================================================= */
function stopLive() {
  if (es) { es.close(); es = null; }
  clearInterval(poll); poll = null;
  clearInterval(upTimer); clearTimeout(dashTimer);
}

let NAV = 0;
function route() {
  NAV++;
  const h = location.hash.slice(1) || "dashboard";
  stopLive();
  if (h.startsWith("subject/")) return viewSubject(+h.split("/")[1]);
  if (h.startsWith("entity/")) return viewEntity(+h.split("/")[1]);
  if (h.startsWith("uploads/")) return viewUploads(+h.split("/")[1]);
  if (h.startsWith("dossier/")) return viewDossier(h.slice(8));
  if (h.startsWith("network/")) return viewNetwork(h.slice(8));
  if (h === "db") return viewDB();
  if (h === "contacts") return viewContacts();
  if (h === "uploads") return viewUploads();
  if (h === "subjects") return viewSubjects();
  if (h === "types") return viewTypes();
  return viewDashboard();
}

$$("#nav a").forEach(a => a.onclick = () => { location.hash = a.dataset.v; });
$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  try {
    toast(`יוזם חקירת מודיעין עבור: ${q}`, "ok");
    const d = await api("/api/search", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q, view: "page"})
    });
    $("#q").value = "";
    if (d && d.profile && !d.profile.building) {
      window._cachedSubjectProfile = { id: +d.subject_id, profile: d.profile, ts: Date.now() };
    }
    const targetHash = "#subject/" + d.subject_id;
    if (location.hash === targetHash) {
      route();
    } else {
      location.hash = "subject/" + d.subject_id;
    }
  } catch (err) {
    toast(err.message, "err");
  }
};

let STATS = null;
async function refreshPause() {
  if (document.hidden) return;
  try {
    const st = await api("/api/stats");
    STATS = st;
    const b = $("#pause");
    b.textContent = st.paused ? "▶ הפעל רשת" : "⏸ עצור רשת";
    b.style.color = st.paused ? "var(--warn)" : "";
  } catch (e) {}
}
$("#pause").onclick = async () => {
  const st = await api("/api/stats").catch(() => ({}));
  await api(st.paused ? "/api/resume" : "/api/pause", { method: "POST" }).catch(() => {});
  refreshPause();
};
refreshPause();
setInterval(refreshPause, 5000);

(function theme() {
  const t = store.g("osnit-theme");
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const n = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = n;
    store.s("osnit-theme", n);
  };
})();

window.addEventListener("hashchange", route);
route();
</script>
