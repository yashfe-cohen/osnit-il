name: gate
on:
  push:
  pull_request:
# Windows-only: the operator runs osnit on Windows, so that is where CI must stay green. Development here also
# runs the same gate locally (tools/gate.py) before every push, which covers the POSIX side — so there is no
# Linux matrix to pay for. Keep this a single job on purpose; the gate is the whole quality contract.
jobs:
  gate:
    runs-on: windows-latest
    env:
      OSNIT_PROVIDERS: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # optional readers the test suite exercises (openpyxl builds .xlsx fixtures; xlrd reads .xls; pypdf reads PDFs;
      # Pillow + pytesseract drive the bundled Tesseract OCR; PyMuPDF/pypdfium2 rasterise and read PDFs; py7zr/patool
      # open archives — all from requirements.txt)
      - run: python -m pip install --upgrade pip
      - run: pip install openpyxl xlrd pypdf pillow pytesseract py7zr patool pymupdf pypdfium2
      - run: python tools/gate.py
